function contractIcon(){if(g.contract==='oa')return '<span style="font-size:38px">↑</span>';if(g.contract==='uu')return '<span style="font-size:38px">↓</span>';return g.contract?suitArt(g.contract):'<span style="font:700 32px Georgia,serif">?</span>'}
function sideHtml(){return `<aside class="sidebar" aria-label="Jass-Tafele"><section class="panel"><p class="panel-kicker">D’Jass-Tafele · Ziel ${g.target}</p><div class="scoreline"><div class="team">Mir & Sämi<small>Dis Team</small></div><div class="score-num">${g.score[0].toLocaleString('de-CH')}</div></div><div class="progress"><span style="width:${Math.min(100,g.score[0]/g.target*100)}%"></span></div><div class="scoreline"><div class="team">Vreni & Köbi<small>D’Gägner</small></div><div class="score-num">${g.score[1].toLocaleString('de-CH')}</div></div><div class="progress foe"><span style="width:${Math.min(100,g.score[1]/g.target*100)}%"></span></div></section>
 <section class="panel"><p class="panel-kicker">${g.round}. Rundi · De Trumpf</p><div class="contract-box"><div class="contract-icon">${contractIcon()}</div><div><div class="contract-label">${contractName(g.contract)}</div><div class="contract-detail">${g.contract?`Faktor ×${multiplier(g.contract)} · ${NAMES[g.chosenBy]} het gwählt`:'No kei Trumpf gwählt'}</div></div></div><div class="rowstats"><div class="mini-stat"><span>Üsi Stiche</span><strong>${g.tricks[0]} / 9</strong></div><div class="mini-stat"><span>Gägner-Stiche</span><strong>${g.tricks[1]} / 9</strong></div><div class="mini-stat"><span>Üsi Rundipünkt</span><strong>${g.roundPts[0]+g.roundWys[0]+g.roundStock[0]+g.roundMatch[0]}</strong></div><div class="mini-stat"><span>Gägner-Pünkt</span><strong>${g.roundPts[1]+g.roundWys[1]+g.roundStock[1]+g.roundMatch[1]}</strong></div></div></section>
 <section class="panel"><p class="panel-kicker">Was am Tisch lauft</p><div class="log">${g.logs.map(x=>`<div class="log-entry">${esc(x)}</div>`).join('')}</div></section><div class="instruction"><strong>Chliini Erinnerig:</strong> Farb bekenne, usser du chasch trumpfe. De Trumpf-Buur muesch nöd zwingend geh. Untertrumpfe dörfsch nume mit eme reine Trumpf-Blatt.</div></aside>`}
function overlayStart(){return `<div class="overlay"><div class="dialog"><div class="eyebrow">Jass-Stube · Eifach lokal</div><h2>Dunschtigs Jass</h2><p class="lead">S’Jasschärtli isch gmischet, de Tisch isch parat. Du jassisch mit em Sämi gäge d’Vreni und de Köbi. En richtige Schieber mit 36 Charte.</p><hr><div class="eyebrow">Weli Partie wotsch?</div><div class="mode-row"><button class="mode-option ${targetChoice===2500?'selected':''}" data-target="2500"><strong>2’500 Pünkt</strong><span>Klassisch · mit Faktor ×1 bis ×3</span></button><button class="mode-option ${targetChoice===1000?'selected':''}" data-target="1000"><strong>1’000 Pünkt</strong><span>Chürzer · alles eifach</span></button></div><div class="muted">Mit Wys, Stöck, Puur, Näll und Match. D’Gägner werded vom Compi gspielt.</div><div class="button-row"><button class="btn" data-action="start">Los jasse →</button><button class="btn secondary" data-action="help">So gaht de Jass</button></div><p class="muted" style="margin-bottom:0">Lauft ohni Internet. Kei Aamäldig, kei fremdi Dateie.</p></div></div>`}
function trumpChoice(){return `<div class="overlay inline"><div class="dialog slim"><div class="eyebrow">Trumpf aasaage · ${g.shoved?'Sämi het gschobe':'Dini Wahl'}</div><h2>Was gits für en Trumpf?</h2><div class="choice-grid">${SUITS.map(s=>`<button class="choice" data-contract="${s.id}">${suitArt(s.id)}<span>${s.name}</span><small>×${multiplier(s.id)}</small></button>`).join('')}<button class="choice" data-contract="oa"><span class="arrow">↑</span><span>Obenabe</span><small>×${multiplier('oa')}</small></button><button class="choice" data-contract="uu"><span class="arrow">↓</span><span>Undenufe</span><small>×${multiplier('uu')}</small></button></div>${!g.shoved?'<div class="button-row"><button class="btn secondary" data-action="schiebe">Zum Sämi schiebe ↗</button></div>':'<p class="muted">De Sämi het gschobe. Jetzt muesch du aasaage.</p>'}</div></div>`}
function wysPopup(){if(g.phase!=='playing'||g.turn!==0||g.trickIndex!==0||g.declared[0]!==null||g.wyses[0].length===0)return'';const best=bestWys(g.wyses[0]);const total=g.wyses[0].reduce((s,w)=>s+w.value,0);return `<div class="wys-bubble"><strong>Du hesch en Wys!</strong><p>${esc(best.label)} (${best.value})${g.wyses[0].length>1?` · Zäme ${total} Wys-Pünkt`:''}. Wotsch dä aasaage?</p><div class="button-row"><button class="btn tiny" data-action="wysyes">Wys säge!</button><button class="btn tiny secondary" data-action="wysno">Nöd wyse</button></div></div>`}
function roundSummary(){const over=g.phase==='finished',t=g.reach;const own=g.score[0]-g.roundStart[0],foe=g.score[1]-g.roundStart[1];return `<div class="overlay inline"><div class="dialog slim">${over?`<span class="winner-crown">${t===0?'🏆':'♠'}</span>`:''}<div class="eyebrow">${over?'D’Partie isch fertig!':`${g.round}. Rundi isch fertig`}</div><h2>${over?(t===0?'Mir händ gwunne!':'D’Gägner händ gwunne.'):g.tricks[0]===9?'En Match für eus!':g.tricks[1]===9?'En Match für d’Gägner!':'D’Charte sind gspielt.'}</h2><p>${over?`Nach ${g.round} ${g.round===1?'Rundi':'Runde'} isch fertig gjasset. ${teamName(t)} händ s’Ziel vo ${g.target} Pünkt erreicht.`:`${contractName(g.contract)} isch ${multiplier(g.contract)}-fach gsi. Jetzt git’s e neui Hand.`}</p><div class="summary-scores"><div class="summary-score"><span class="panel-kicker">Mir & Sämi</span><b>${g.score[0]}</b><small>Die Rundi: +${own} · ${g.tricks[0]} Stiche</small>${g.roundWys[0]||g.roundStock[0]||g.roundMatch[0]?`<small>Wys ${g.roundWys[0]} · Stöck ${g.roundStock[0]} · Match ${g.roundMatch[0]}</small>`:''}</div><div class="summary-score"><span class="panel-kicker">Vreni & Köbi</span><b>${g.score[1]}</b><small>Die Rundi: +${foe} · ${g.tricks[1]} Stiche</small>${g.roundWys[1]||g.roundStock[1]||g.roundMatch[1]?`<small>Wys ${g.roundWys[1]} · Stöck ${g.roundStock[1]} · Match ${g.roundMatch[1]}</small>`:''}</div></div><div class="button-row"><button class="btn" data-action="${over?'restart':'nextround'}">${over?'Nomol jasse →':'Nächsti Rundi →'}</button></div></div></div>`}
function overlayHelp(){return `<div class="overlay help"><div class="dialog slim"><div class="eyebrow">Kurzi Jasschunde</div><h2>So gaht de Schieber</h2><div class="rules"><div class="rule"><strong>Mir gäge die andere.</strong> Vier Lüüt, zwöi Teams. Du und de Sämi ghöred zäme. Jede bechunnt nüün Charte. Gspielt wird de Reihe na am Tisch.</div><div class="rule"><strong>Trumpf oder schiebe.</strong> D’Vorhand seit Eichle, Rose, Schelle, Schilte, Obenabe oder Undenufe. Oder sie schiebt em Partner, wo denn mues aasaage. D’Vorhand spielt immer zerscht.</div><div class="rule"><strong>Farb bekenne.</strong> Hesch d’usgspielti Farb, muesch sie spiele. Du derfsch aber immer trumpfe. Untertrumpfe isch nume erlaubt, wenn du nüt anders als Trumpf hesch. De Puur isch d’Uusnahm: Dä muesch nie zwingend hergäh. Bi Obenabe und Undenufe muesch d’Farb bekenne.</div><div class="rule"><strong>Puur und Näll.</strong> Bi Trumpf isch de Under (Puur) am stärchschte und git 20 Pünkt. Denn chunnt de Nüüner (Näll) mit 14. S’Ass git 11, de Banner 10, de König 4, de Ober 3.</div><div class="rule"><strong>Obenabe / Undenufe.</strong> Ohni Trumpf: bi Obenabe sticht s’Ass, bi Undenufe de Sächser. D’Achter zähled je 8 Pünkt, bi Undenufe git de Sächser 11 Pünkt. Jede Rundi het 157 Stichpünkt mit em letschte Stich.</div><div class="rule"><strong>Wys, Stöck & Match.</strong> Drü Charte i de Reihe git 20 Wys-Pünkt, vier 50, fünf 100. Vier gliichi sind au en Wys. Wys sägsch mit dinere erschte Charte. König und Ober vom Trumpf git 20 Stöck-Pünkt, sobald beidi gspielt sind. Alli nüün Stiche sind en Match und gäbed 100 extra.</div><div class="rule"><strong>Pünkt.</strong> Bis 2’500: Eichle/Rose ×1, Schelle/Schilte ×2, Obenabe/Undenufe ×3. Bis 1’000: alles ×1. S’Team, wo zerscht s’Ziel erreicht, gwünnt.</div></div><div class="button-row"><button class="btn" data-action="closehelp">Alles klar!</button></div></div></div>`}
function render(){const show=!!g;app.innerHTML=`<header class="topbar"><div class="brand"><div class="logo">J</div><div><small>De legendäri Jassstube</small><h1>Dunschtigs Jass</h1></div></div><div class="top-actions"><button class="icon-btn" data-action="sound" title="Ton aa oder us">${soundOn?'♪ Ton aa':'♪ Ton us'}</button><button class="icon-btn" data-action="help">? Regle</button><button class="icon-btn" data-action="new" title="E neui Partie aafange">↻ Neu</button></div></header>${show?`<main class="layout"><div class="board-shell"><div class="board"><div class="stamped">JASS<span>SIT 1900 IRGENDÖPPIS</span></div><div class="top-hint">♢ ${g.round}. RUNDI &nbsp; · &nbsp; STICH ${Math.min(g.trickIndex+1,9)} / 9 ♢</div>${seatHtml(2,'top')}${seatHtml(3,'left')}${seatHtml(1,'right')}${seatHtml(0,'you')}<div class="trick-zone">${g.trick.map(p=>`<div class="trick-card s${p.seat} ${g.phase==='trickReview'&&p.seat===g.lastWin?'won':''}"><div class="seat-card">${cardHtml(p.card)}</div></div>`).join('')}</div>${g.phase==='playing'||g.phase==='choose'||g.phase==='trickReview'?`<div class="statusbar"><span class="primary">${esc(mainStatus().main)}</span><span class="sub">${esc(mainStatus().sub)}</span></div>`:''}${g.phase==='trickReview'?'<div class="center-actions"><button class="btn tiny" data-action="advance">Wiiter jasse →</button></div>':''}<div class="my-hand" aria-label="Dini Charte">${handHtml()}</div>${g.phase==='choose'&&g.chooser===0?trumpChoice():''}${wysPopup()}${['roundReview','finished'].includes(g.phase)?roundSummary():''}</div></div>${sideHtml()}</main>`:`<main class="layout"><div class="board-shell"><div class="board"><div class="stamped">JASS<span>STUBE & SPIEL</span></div></div></div></main>`}${startOpen?overlayStart():''}${helpOpen?overlayHelp():''}${toastMsg?`<div class="toast" role="status">${esc(toastMsg)}</div>`:''}`}
app.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const a=btn.dataset.action,contract=btn.dataset.contract,id=btn.dataset.card,chooseTarget=btn.dataset.target;
 if(chooseTarget){targetChoice=Number(chooseTarget);render();return}
 if(a==='help'){helpOpen=true;clearTimeout(timer);render();return}
 if(a==='closehelp'){helpOpen=false;render();progress();return}
 if(a==='sound'){soundOn=!soundOn;render();return}
 if(a==='new'){startOpen=true;helpOpen=false;tick++;clearTimeout(timer);render();return}
 if(a==='start'||a==='restart'){newMatch();return}
 if(!g||startOpen||helpOpen)return;
 if(contract&&g.phase==='choose'&&g.chooser===0){choose(contract,0);return}
 if(a==='schiebe'&&g.phase==='choose'&&g.chooser===0){choose('schiebe',0);return}
 if(a==='wysyes'||a==='wysno'){noteWys(0,a==='wysyes');return}
 if(id){play(0,id);return}
 if(a==='advance'){tick++;clearTimeout(timer);advance();return}
 if(a==='nextround'){nextRound();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&helpOpen){helpOpen=false;render();progress()}if(e.key.toLowerCase()==='m'&&!e.repeat){soundOn=!soundOn;render()} });
render();
})();
</script>
</body>
</html>
