function nextRooms(g){if(g.stage===6)return ['boss'];const plans={1:['combat','combat','combat'],2:['combat','event','shop'],3:['combat','elite','rest'],4:['combat','event','treasure'],5:['rest','shop','elite']};return mix(plans[g.stage]||['combat','event','rest'])}

function load(){try{const obj=JSON.parse(localStorage.getItem(SAVE_KEY));if(obj&&obj.version===3&&obj.phase&&obj.deck&&Array.isArray(obj.deck)&&obj.act>=1&&obj.act<=3)return obj}catch(e){}return null}
function wipe(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function record(){try{return JSON.parse(localStorage.getItem(RECORD_KEY))||null}catch(e){return null}}
function trackRecord(){const score=G.roomsCleared*100+G.kills*25+G.gold+G.relics.length*70+(G.phase==='victory'?2000:0);const old=record();if(!old||score>old.score)try{localStorage.setItem(RECORD_KEY,JSON.stringify({score,rooms:G.roomsCleared,won:G.phase==='victory',date:new Date().toLocaleDateString('de-CH')}))}catch(e){}return score}
function sfx(name){if(!G||G.muted)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C;if(audio.state==='suspended')audio.resume();const sequences={click:[[400,.035]],card:[[480,.05],[660,.065]],hit:[[135,.08],[110,.1]],block:[[280,.06]],heal:[[510,.09],[750,.1]],gold:[[710,.09],[950,.09]],hurt:[[140,.09],[88,.17]],win:[[440,.1],[554,.1],[659,.1],[880,.23]],loss:[[280,.13],[210,.16],[140,.26]],turn:[[380,.06]],upgrade:[[450,.08],[680,.13],[950,.13]]};let seq=sequences[name]||sequences.click;let start=audio.currentTime;seq.forEach(([freq,len],i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=name==='hurt'||name==='hit'?'sawtooth':'triangle';osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(name==='hit'?.035:.055,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+len);osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+len+.012);start+=len*.72})}catch(e){}}
function notice(text){const host=$('#toastHost');if(!host)return;host.innerHTML=`<div class="toast">${E(text)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>host.innerHTML='',1900)}
function say(text){G.log.unshift(text);if(G.log.length>16)G.log.length=16}
function heal(n){const was=G.hp;G.hp=Math.min(G.maxHp,G.hp+n);return G.hp-was}
function damageHero(n,source=''){n=Math.max(0,Math.ceil(n));const blocked=Math.min(G.block,n);G.block-=blocked;const amount=n-blocked;G.hp=Math.max(0,G.hp-amount);if(amount>0){sfx('hurt');say(`${source||'Treffer'}: −${amount} LP${blocked?' (Block: '+blocked+')':''}.`)}else if(blocked)say(`Dein Block fängt ${blocked} Schaden ab.`);if(G.hp<=0){G.phase='gameover';busy=false;wipe();trackRecord();sfx('loss')}return amount}
function loseHp(n){G.hp=Math.max(0,G.hp-n);if(G.hp<=0){G.phase='gameover';busy=false;wipe();trackRecord();sfx('loss')}}
function relicHas(id){return G.relics.includes(id)}
function availableRelics(rarity=null){return Object.keys(RELICS).filter(k=>!G.relics.includes(k)&&(!rarity||RELICS[k].rarity===rarity))}
function relicChoices(n=3,rarity=null){let a=availableRelics(rarity);if(a.length<n){a=[...a,...availableRelics().filter(k=>!a.includes(k))]}return mix(a).slice(0,n)}
function addRelic(id){if(relicHas(id))return;G.relics.push(id);say(`Relikt: ${RELICS[id].name}.`);if(id==='charm'){G.maxHp+=10;heal(10)}if(id==='key')G.gold+=85;if(id==='chalice'){G.maxHp+=18;heal(12)}sfx('upgrade')}
function rewardCards(n=3,rareBoost=false){const picked=[];const pool=POOL.filter(k=>!rareBoost||CARDS[k].rarity!=='common');for(let i=0;i<n;i++){const candidates=pool.filter(k=>!picked.includes(k));if(!candidates.length)break;const weighted=[];for(const c of candidates){const r=CARDS[c].rarity;for(let j=0;j<(r==='common'?5:r==='uncommon'?3:1);j++)weighted.push(c)}picked.push(pick(weighted))}return picked}
function addCard(id,up=false){G.deck.push(card(id,G,up));sfx('card')}
function potionDrop(id){if(G.potions.length>=3)return false;G.potions.push(id);return true}
function topHUD(){if(!G||G.phase==='menu')return '';return `<div class="hud-line"><div class="hud"><div class="hud-stat floor">♜ Akt ${G.act}/3 · Raum ${G.stage}/6</div><div class="hud-stat hp"><span class="icon">♥</span><b>${G.hp}/${G.maxHp}</b> LP</div><div class="hud-stat coins"><span class="icon">◈</span><b>${G.gold}</b> Gold</div><div class="hud-stat">▣ <b>${G.deck.length}</b> Karten</div></div><div class="progress" title="Fortschritt innerhalb des Akts">${Array.from({length:6},(_,i)=>`<span class="pip ${i<G.stage-1?'done':i===G.stage-1?'now':''}"></span>`).join('')}</div></div>`}
function relicStrip(){return G.relics.length?`<div class="relic-strip">${G.relics.map(k=>`<span class="relic-chip" title="${E(RELICS[k].name)} — ${E(RELICS[k].desc)}">${RELICS[k].icon}</span>`).join('')}</div>`:'<span class="subtext">Noch keine Relikte</span>'}
function heading(kicker,title,desc){return `<div class="page-heading"><div class="eyebrow">${kicker}</div><h1 class="section-title" style="margin-top:9px">${title}</h1><p class="subtext">${desc}</p><div class="divider-glyph">✦</div></div>`}
function menuUI(){let saved=load(),rec=record();return `<section class="main-menu"><div class="menu-content"><div class="menu-icon">♜</div><h1 class="menu-title">CRYPT <span>&</span><br>CARDS</h1><div class="menu-tag">Die Gruft wartet nicht</div><p class="menu-desc">Steige in drei finstere Dungeon-Etappen hinab. Kämpfe mit Karten, baue dein Deck, sammle Relikte und überlebe den Thron der Schatten.</p><div class="menu-buttons">${saved?'<button class="btn" data-action="continue">▶ Spiel fortsetzen</button>':''}<button class="btn ${saved?'secondary':''}" data-action="new">${saved?'↻ Neuer Durchlauf':'⚔ Abenteuer beginnen'}</button><button class="btn secondary" data-action="rules">? Spielregeln</button></div><div class="menu-features"><span>3 Akte</span><span>28 Kartenarten</span><span>16 Relikte</span><span>Permadeath</span></div>${rec?`<p class="save-note">Persönlicher Rekord: ${rec.score} Punkte · ${rec.won?'Dungeon bezwungen':'Tiefster Versuch: '+rec.rooms+' Räume'}</p>`:'<p class="save-note">Automatische Speicherung · Kein Download zusätzlicher Inhalte</p>'}</div></section>`}
function mapUI(){return `${topHUD()}${heading(`AKT ${G.act} · ${ACT_NAMES[G.act-1]}`,'Wähle deinen nächsten Weg','Jede Entscheidung verändert deinen Durchlauf. Wähle einen von drei möglichen Räumen.')}
<div class="map-floorline">${Array.from({length:6},(_,i)=>`${i?`<div class="line ${i<G.stage?'past':''}"></div>`:''}<div class="node ${i<G.stage-1?'past':i===G.stage-1?'now':''}" title="Raum ${i+1}">${i===5?'♛':i+1}</div>`).join('')}</div><div class="map-grid ${G.rooms.length===1?'boss-only':''}">${G.rooms.map((k,i)=>`<button class="room-card ${k}" data-action="room" data-value="${k}" aria-label="${ROOMS[k].title}"><div class="room-icon">${ROOMS[k].icon}</div><h3>${ROOMS[k].title}</h3><p class="subtext">${ROOMS[k].desc}</p><div class="enter-label">Betreten →</div></button>`).join('')}</div><div style="max-width:1100px;margin:15px auto;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span class="eyebrow">Deine Relikte</span>${relicStrip()}</div>`}
function statusHTML(entity){const a=[];if(entity.block>0)a.push(['block','⬡',entity.block,'Block: Verhindert Schaden, bis er verbraucht wird.']);if(entity.strength>0)a.push(['str','⚔',entity.strength,'Stärke: Zusätzlicher Angriffsschaden.']);if(entity.weak>0)a.push(['weak','↓',entity.weak,'Schwach: Verursacht 25 % weniger Angriffsschaden.']);if(entity.vuln>0)a.push(['vuln','◇',entity.vuln,'Verwundbar: Erleidet 50 % mehr Angriffsschaden.']);if(entity.poison>0)a.push(['poison','☣',entity.poison,'Gift: Verliert zu Zugbeginn LP, danach −1 Gift. Ignoriert Block.']);if(entity.thorns>0)a.push(['thorns','✣',entity.thorns,'Dornen: Fügt Angreifern Schaden zu.']);return a.map(([cls,ic,n,title])=>`<span class="status ${cls}" title="${E(title)}">${ic} ${n}</span>`).join('')}
function hpBar(p,player=false){return `<div class="hp-track ${player?'player':''}"><div class="hp-fill" style="width:${bound(p.hp/p.maxHp*100,0,100)}%"></div><span class="hp-number">${p.hp} / ${p.maxHp}</span></div>`}
function enemyIntent(e){const it=e.intent;if(!it)return '—';let text='';if(['attack','heavy','multi'].includes(it.type)){const dam=enemyAttackPower(e,it.value);text=`⚔ ${dam}${it.type==='multi'?' × '+it.hits:''}`}else if(it.type==='guard')text=`⬡ ${it.value} Block`;else if(it.type==='buff')text=`✦ +${it.value} Stärke`;else if(it.type==='hex')text=`☽ ${it.value} Schwach`;else if(it.type==='poison')text=`☣ ${it.value} Gift`;else if(it.type==='heal')text=`♥ +${it.value}`;return `<div class="intent ${['guard','buff','heal'].includes(it.type)?'buff':['hex','poison'].includes(it.type)?'debuff':''}" title="Nächste Aktion: ${E(text)}">${text}</div>`}
function enemyAttackPower(e,base){return Math.max(0,Math.floor((base+e.strength)*(e.weak>0?.75:1)*(G.vuln>0?1.5:1)))}
function cardHTML(c,option={}){let d=CARDS[c.id];if(!d)return '';let disabled=option.playable&&((d.cost>G.combat.energy)||d.type==='curse'||busy);let className=`game-card ${d.type}${disabled?' unplayable':''}`;const index=option.index;return `<button class="${className}" ${option.action?`data-action="${option.action}" data-value="${c.uid||c.id}"`:''} ${disabled?'disabled':''} title="${E(d.name)}: ${E(d.desc(c.up))}" aria-label="${E(d.name)}, ${d.cost} Energie, ${E(d.desc(c.up))}"><div class="card-top"><span class="card-cost">${d.cost}</span><span class="card-type">${d.type==='attack'?'ANGRIFF':d.type==='skill'?'FÄHIGKEIT':d.type==='power'?'MACHT':'FLUCH'}</span></div><div class="card-art">${d.icon}</div><div class="card-name">${E(d.name)}${c.up?'<span class="plus">+</span>':''}</div><div class="card-desc">${E(d.desc(c.up))}</div>${d.exhaust?'<div class="card-exhaust">Einmalig</div>':''}${index!=null?`<span class="card-key">${index+1}</span>`:''}</button>`}
function battleUI(){const c=G.combat;if(!c)return '';const es=c.enemies;return `${topHUD()}<div class="battle-layout"><div><div class="panel battle-scene"><div class="scene-info"><div><span class="eyebrow">${c.kind==='boss'?'✦ Bosskampf':c.kind==='elite'?'⚑ Elitekampf':'⚔ Kampf'}</span><div style="font-family:Georgia,serif;font-size:19px;margin-top:5px">${ACT_NAMES[G.act-1]}</div></div><div class="turn-tag">ZUG ${c.turn}</div></div><div class="fight-field"><div class="fighter hero"><div class="fighter-figure"><div class="figure-ring"></div>♞</div><div class="fighter-name">Der Wanderer</div>${hpBar(G,true)}<div class="statuses">${statusHTML(G)}</div></div><div class="enemy-team">${es.map(e=>`<div class="fighter enemy ${e.hp<=0?'dead':''} ${c.selectedEnemy===e.uid?'target':''}" data-action="target" data-value="${e.uid}" title="${e.hp>0?'Als Ziel auswählen':'Besiegt'}"><div class="fighter-figure"><div class="figure-ring"></div>${e.icon}</div><div class="fighter-name">${E(e.name)}</div>${hpBar(e)}<div class="statuses">${statusHTML(e)}</div>${e.hp>0?enemyIntent(e):'<div class="intent">Besiegt</div>'}</div>`).join('')}</div></div></div><div class="panel combat-bottom"><div class="hand-header"><div><span class="eyebrow">Deine Hand</span><div class="subtext">Karte anklicken · Gegner als Ziel auswählen · Tasten 1–9</div></div><span style="font-size:12px;color:var(--blue);font-weight:bold">ϟ ${c.energy} Energie</span></div><div class="hand-area">${c.hand.length?c.hand.map((x,i)=>cardHTML(x,{playable:true,action:'play',index:i})).join(''):'<div class="hand-empty">Keine Karten mehr auf der Hand.</div>'}</div><div class="hand-controls"><div class="energy-orbs"><span class="energy-number">ENERGIE</span>${Array.from({length:Math.min(8,Math.max(3,c.energy))},(_,i)=>`<span class="energy-orb ${i>=c.energy?'empty':''}"></span>`).join('')}</div><button class="btn ${busy?'secondary':''}" data-action="endturn" ${busy?'disabled':''}>Zug beenden ↵</button></div></div></div><aside class="panel battle-side"><div class="side-title">Kartenstapel</div><div class="pile-counts"><button class="pile" data-action="pile" data-value="draw"><b>${c.draw.length}</b><span>Nachziehen</span></button><button class="pile" data-action="pile" data-value="discard"><b>${c.discard.length}</b><span>Ablage</span></button></div><div class="side-title">Tränke (${G.potions.length}/3)</div><div class="potions">${G.potions.length?G.potions.map((k,i)=>`<button class="potion-btn" data-action="potion" data-value="${i}" title="${E(POTIONS[k].desc)}"><span class="symbol">${POTIONS[k].icon}</span>${E(POTIONS[k].name)}</button>`).join(''):'<span class="subtext">Keine Tränke</span>'}</div><div class="side-title">Relikte</div>${relicStrip()}<div class="side-title">Kampfprotokoll</div><div class="battle-log">${G.log.map(line=>`<div class="logline">${E(line)}</div>`).join('')}</div></aside></div>`}
function rewardUI(){const r=G.reward;if(!r)return '';if(r.stage==='relic')return `${topHUD()}${heading('Beute nach dem Kampf','Wähle ein Relikt','Du darfst genau ein Relikt für deinen weiteren Weg mitnehmen.')}<div class="reward-cards">${r.relics.map(k=>relicChoiceHTML(k,'chooseRelic')).join('')}</div><div class="center-action"><button class="btn secondary" data-action="skipRelic">Ohne Relikt weiter</button></div>`;return `${topHUD()}${heading('Sieg über die Dunkelheit','Ein neuer Schatz','Wähle eine Karte für dein Deck oder verzichte darauf, um es schlank zu halten.')}<div class="reward-extras"><div class="reward-token">◈ +${r.gold} Gold erhalten</div>${r.potion?`<div class="reward-token">⚗ ${E(POTIONS[r.potion].name)} erhalten</div>`:''}${r.relics.length?'<div class="reward-token">♛ Anschliessend: Reliktauswahl</div>':''}</div><div class="reward-cards">${r.cards.map(k=>cardHTML({id:k,up:false,uid:k},{action:'rewardCard'})).join('')}</div><div class="center-action"><button class="btn secondary" data-action="skipCard">Keine Karte nehmen</button></div>`}
function relicChoiceHTML(k,action){const r=RELICS[k];return `<button class="relic-card" data-action="${action}" data-value="${k}"><span class="relic-icon">${r.icon}</span><h3>${E(r.name)}</h3><span class="subtext">${E(r.desc)}</span><span class="eyebrow">Auswählen →</span></button>`}
function campUI(){return `${topHUD()}${heading('Ein Moment der Ruhe','Verlassenes Lager','Das Feuer brennt noch. Du hast Zeit für genau eine Handlung.')}<div class="choice-grid"><button class="choice-card" data-action="campHeal"><div class="big-icon">♨</div><h3>Wunden versorgen</h3><p class="subtext">Heile 30 % deiner maximalen Lebenspunkte (${Math.ceil(G.maxHp*.3)} LP).</p><div class="cost">♥ ${G.hp}/${G.maxHp} LP</div></button><button class="choice-card" data-action="campUpgrade" ${G.deck.every(c=>c.up||c.id==='curse')?'disabled':''}><div class="big-icon">✦</div><h3>Schmiedefeuer</h3><p class="subtext">Verbessere eine Karte dauerhaft. Mehr Schaden, Block oder stärkere Effekte.</p><div class="cost">KOSTENLOS</div></button><button class="choice-card" data-action="campLeave"><div class="big-icon">➜</div><h3>Weiterreisen</h3><p class="subtext">Verlasse das Lager, ohne eine Handlung zu wählen.</p><div class="cost">WEITER →</div></button></div>`}
function eventUI(){let e=EVENTS[G.event.idx];return `${topHUD()}${heading('Unbekannte Begegnung',e.title,e.body)}<div style="font-size:75px;text-align:center;margin:10px">${e.icon}</div><div class="choice-grid">${e.opts.map((o,i)=>`<button class="choice-card" data-action="eventChoice" data-value="${i}" ${o.fx==='offering'&&G.gold<35?'disabled':''}><div class="big-icon">${['✦','◈','➜'][i]}</div><h3>${E(o.text)}</h3><p class="subtext">${E(o.hint)}</p><div class="cost">${i===2?'KEIN RISIKO':'ENTSCHEIDEN'} →</div></button>`).join('')}</div>`}
function shopUI(){return `${topHUD()}${heading('Der Schwarze Markt','Schätze & Versuchungen','Ein schweigsamer Händler tauscht Waren gegen Gold. Du kannst mehrere Angebote kaufen.')}<div style="text-align:center;margin-bottom:17px;color:var(--gold);font-size:19px;font-weight:bold">◈ Dein Gold: ${G.gold}</div><div class="shop-grid">${G.shop.items.map((item,i)=>{let isCard=item.kind==='card',isRelic=item.kind==='relic',isPotion=item.kind==='potion';let obj=isCard?CARDS[item.id]:isRelic?RELICS[item.id]:POTIONS[item.id];let title=obj.name;let desc=isCard?obj.desc(false):obj.desc;let ic=obj.icon;return `<div class="shop-item ${item.sold?'sold':''}"><div class="shop-icon">${ic}</div><h3>${E(title)}</h3><div class="subtext">${E(desc)}</div><button class="btn small" data-action="buy" data-value="${i}" ${item.sold||G.gold<item.price?'disabled':''}>${item.sold?'VERKAUFT':'◈ '+item.price}</button></div>`}).join('')}<div class="shop-item"><div class="shop-icon">✂</div><h3>Karte entfernen</h3><div class="subtext">Entferne eine Karte dauerhaft aus deinem Deck. Nur einmal pro Händler.</div><button class="btn small" data-action="shopRemove" ${G.shop.removed||G.gold<55||G.deck.length<=1?'disabled':''}>${G.shop.removed?'ERLEDIGT':'◈ 55'}</button></div><div class="shop-item"><div class="shop-icon">♥</div><h3>Heildienst</h3><div class="subtext">Heile 24 Lebenspunkte. Nur einmal pro Händler.</div><button class="btn small" data-action="shopHeal" ${G.shop.healed||G.gold<35||G.hp>=G.maxHp?'disabled':''}>${G.shop.healed?'ERLEDIGT':'◈ 35'}</button></div></div><div class="center-action"><button class="btn secondary" data-action="leaveRoom">Händler verlassen →</button></div>`}
function treasureUI(){return `${topHUD()}${heading('Du findest eine Truhe','Schatzkammer','Drei Relikte liegen vor dir. Du darfst eines davon mitnehmen.')}<div class="reward-cards">${G.reward.relics.length?G.reward.relics.map(k=>relicChoiceHTML(k,'treasureRelic')).join(''):'<p class="subtext">Die Truhe ist leer. Deine Tasche enthält bereits alle verfügbaren Relikte.</p>'}</div><div class="center-action"><button class="btn secondary" data-action="leaveRoom">Weitergehen →</button></div>`}
function endUI(){const win=G.phase==='victory',score=trackRecord();return `${topHUD()}<div class="panel ending"><div class="eyebrow">${win?'DUNGEON BEZWUNGEN':'DEIN ABENTEUER ENDET HIER'}</div><div class="end-symbol">${win?'♛':'☠'}</div><h1 class="section-title">${win?'Du hast die Schatten besiegt!':'Die Gruft fordert ihren Tribut.'}</h1><p class="subtext" style="margin:13px auto;max-width:550px">${win?'Alle drei Wächter sind bezwungen. Dein Deck wird in den Chroniken der Gruft verewigt.':'Der nächste Durchlauf beginnt mit einem neuen Deck. Jeder Kampf ist eine neue Chance.'}</p><div class="ending-stats"><div><b>${G.roomsCleared}</b><span>Räume</span></div><div><b>${G.kills}</b><span>Gegner besiegt</span></div><div><b>${score}</b><span>Punkte</span></div><div><b>${G.played}</b><span>Karten gespielt</span></div><div><b>${G.relics.length}</b><span>Relikte</span></div><div><b>${G.gold}</b><span>Gold</span></div></div><button class="btn" data-action="new">↻ Neuer Durchlauf</button><div style="margin-top:12px"><button class="btn secondary small" data-action="menu">Zum Titelbildschirm</button></div></div>`}
function render(){const app=$('#app');if(!app)return;app.innerHTML=!G||G.phase==='menu'?menuUI():G.phase==='route'?mapUI():G.phase==='combat'?battleUI():G.phase==='reward'?rewardUI():G.phase==='camp'?campUI():G.phase==='event'?eventUI():G.phase==='shop'?shopUI():G.phase==='treasure'?treasureUI():endUI();let sb=$('#soundButton');sb.textContent=G&&G.muted?'♪ Ton aus':'♫ Ton an';sb.classList.toggle('active',!!G&&!G.muted);renderModal();save()}
function renderModal(){const host=$('#modalHost');if(!overlay){host.innerHTML='';return}let content='';let title='';if(overlay.kind==='rules'){title='So funktioniert das Spiel';content=`<div class="rules"><div><b>Ziel.</b> Besiege die drei Bossgegner in 18 Dungeonräumen. Nach dem Tod beginnt ein neuer Durchlauf.</div><div><b>Kämpfen.</b> Ziehe zu Rundenbeginn 5 Karten. Du hast normalerweise 3 Energie und kannst so viele Karten spielen, wie du bezahlen kannst. Klicke einen Gegner an, um ihn als Ziel auszuwählen. Über jedem Gegner steht seine <b>nächste Aktion</b>.</div><div><b>Zugende.</b> Nicht ausgespielte Handkarten wandern auf den Ablagestapel. Danach handeln die Gegner. Sobald der Nachziehstapel leer ist, wird die Ablage gemischt. Nicht verbrauchter Block verfällt zu Beginn deines nächsten Zuges.</div><div><b>Effekte.</b> <b>Block ⬡</b> fängt Schaden ab. <b>Stärke ⚔</b> erhöht Angriffsschaden. <b>Schwach ↓</b> senkt Angriffsschaden um 25 %. <b>Verwundbar ◇</b> erhöht eingehenden Angriffsschaden um 50 %. <b>Gift ☣</b> verursacht zu Zugbeginn Schaden, der Block ignoriert; der Giftwert sinkt dann um 1. <b>Dornen ✣</b> schädigen Angreifer.</div><div><b>Deckbau.</b> Besiegte Gegner hinterlassen Gold und eine Auswahl neuer Karten. Händler, Rastplätze und Relikte verändern deine Strategie. Mächtige Karten sind nicht immer besser als ein schlankes Deck.</div><div><b>Bedienung.</b> Karte anklicken oder <kbd>1</kbd>–<kbd>9</kbd> drücken; <kbd>Leertaste</kbd> beendet deinen Zug; <kbd>Esc</kbd> schliesst Fenster. Tränke sind einmalig, maximal drei gleichzeitig.</div><div><b>Offline.</b> Alles läuft lokal in dieser HTML-Datei. Spielstände und Rekorde werden, sofern erlaubt, im Browser gespeichert. Es gibt keine Online-Verbindung.</div></div>`}
else if(overlay.kind==='deck'||overlay.kind==='pile'){const pile=overlay.kind==='pile'?G.combat[overlay.pile]:G.deck;title=overlay.kind==='pile'?(overlay.pile==='draw'?'Nachziehstapel':'Ablagestapel'):`Dein Deck (${G.deck.length} Karten)`;content=`<p class="subtext">${overlay.kind==='pile'?'Diese Karten befinden sich aktuell in diesem Stapel.':'Dies sind die dauerhaft gesammelten Karten deines Durchlaufs.'}</p><div class="modal-card-grid">${pile.length?pile.map(c=>cardHTML(c)).join(''):'<p class="subtext">Dieser Stapel ist leer.</p>'}</div>`}
else if(overlay.kind==='upgrade'||overlay.kind==='remove'){const upgrading=overlay.kind==='upgrade';title=upgrading?'Karte verbessern':'Karte entfernen';const cards=G.deck.filter(c=>upgrading?(!c.up&&c.id!=='curse'):G.deck.length>1);content=`<p class="subtext">${upgrading?'Wähle eine Karte, die du dauerhaft verbessern möchtest.':'Wähle eine Karte, die dauerhaft aus deinem Deck verschwindet.'}</p><div class="modal-card-grid">${cards.map(c=>cardHTML(c,{action:upgrading?'upgradeCard':'removeCard'})).join('')}</div>${!cards.length?'<p class="subtext">Keine passende Karte vorhanden.</p>':''}`}
else return;
host.innerHTML=`<div class="modal-backdrop" data-action="closeOutside"><section class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="modal-header"><div class="section-title">${E(title)}</div><button class="mini-btn" data-action="close">✕ Schliessen</button></div>${content}</section></div>`}
function goMenu(){overlay=null;busy=false;G={phase:'menu',muted:G?G.muted:false};render()}
function newGame(){busy=false;overlay=null;G=blankGame();render();sfx('win')}
function completeRoom(){G.roomsCleared++;if(G.stage>=6){if(G.act===3){G.phase='victory';wipe();trackRecord();sfx('win');render();return}G.act++;G.stage=1;heal(15);notice('Neuer Akt! +15 LP')}else G.stage++;G.rooms=nextRooms(G);G.phase='route';G.reward=null;G.event=null;G.shop=null;G.combat=null;G.strength=0;G.weak=0;G.vuln=0;G.poison=0;G.thorns=0;G.block=0;render()}
function enterRoom(type){if(G.phase!=='route')return;if(!G.rooms.includes(type))return;G.routeHistory.push({act:G.act,stage:G.stage,type});G.log=[];if(type==='combat'||type==='elite'||type==='boss'){startCombat(type)}else if(type==='rest'){G.phase='camp';render()}else if(type==='event'){G.event={idx:R(0,EVENTS.length-1)};G.phase='event';render()}else if(type==='shop'){openShop()}else if(type==='treasure'){G.reward={relics:relicChoices(3)};G.phase='treasure';render()}}
function spawnEnemy(key,slot=0){const def=ENEMIES[key],act=G.act;const hp=Math.round(def.hp*(1+(act-1)*.16)+G.stage*(act===1?1:1.7));return {uid:++G.idCounter,key,name:def.name,icon:def.icon,hp,maxHp:hp,block:0,strength:0,weak:0,vuln:0,poison:0,thorns:0,dmg:def.dmg+(act-1)*2+(G.stage>=4?1:0),offset:slot?R(0,1):0,intent:null}}
function encounter(kind){if(kind==='boss')return ['boss'+G.act];if(kind==='elite')return ['elite'+G.act];const pools=[['rat','bone','cult','spider'],['imp','shade','knight','witch'],['golem','wraith','demon','witch']];let pool=pools[G.act-1];if(G.stage<=2)return [pick(pool)];return Math.random()<.65?[pick(pool),pick(pool)]:[pick(pool)]}
function startCombat(kind){const names=encounter(kind);const enemies=names.map((id,i)=>spawnEnemy(id,i));G.combat={kind,enemies,selectedEnemy:enemies[0].uid,energy:3,turn:1,draw:mix(G.deck.map(c=>({...c}))),discard:[],hand:[],exhaust:[],firstAttack:false};G.phase='combat';G.strength=relicHas('ember')?1:0;G.weak=0;G.vuln=0;G.poison=0;G.thorns=relicHas('thorns')?3:0;G.block=relicHas('shield')?7:0;if(relicHas('chalice'))loseHp(6);if(G.phase==='gameover'){render();return}if(relicHas('memento'))enemies.forEach(e=>e.weak+=2);say(`${names.map(n=>ENEMIES[n].name).join(' und ')} stellen sich dir in den Weg.`);beginTurn(true);sfx('turn');render()}
function prepareIntents(){if(!G.combat)return;for(const e of G.combat.enemies){if(e.hp<=0)continue;const d=ENEMIES[e.key],turn=G.combat.turn;const t=d.pattern[(turn-1+e.offset)%d.pattern.length];let value=0,hits=1;if(t==='attack')value=e.dmg;if(t==='heavy')value=Math.round(e.dmg*1.55);if(t==='multi'){value=Math.max(3,Math.round(e.dmg*.58));hits=2}if(t==='guard')value=7+G.act*3;if(t==='buff')value=2;if(t==='poison')value=3+G.act;if(t==='hex')value=2;if(t==='heal')value=10+G.act*3;e.intent={type:t,value,hits}}}
function drawCards(n){const c=G.combat;if(!c)return;for(let i=0;i<n;i++){if(!c.draw.length){if(!c.discard.length)break;c.draw=mix(c.discard);c.discard=[];say('Ablagestapel neu gemischt.')}if(c.hand.length>=10){say('Handkartenlimit von 10 erreicht.');break}c.hand.push(c.draw.pop())}}
function beginTurn(first=false){if(!G.combat)return;const c=G.combat;if(!first){G.block=0;if(G.poison>0){let n=G.poison;G.hp=Math.max(0,G.hp-n);G.poison--;say(`Gift verursacht ${n} LP Schaden.`);if(G.hp<=0){G.phase='gameover';wipe();trackRecord();sfx('loss');return}}}c.energy=3+(relicHas('crown')?1:0)+(first&&relicHas('clock')?1:0);c.firstAttack=false;drawCards(5+(relicHas('tome')?1:0)+(first&&relicHas('lantern')?1:0));prepareIntents();say(`Zug ${c.turn}: ${c.energy} Energie verfügbar.`)}
function selectEnemy(uid){if(!G.combat||G.phase!=='combat'||busy)return;const e=G.combat.enemies.find(e=>e.uid===Number(uid)&&e.hp>0);if(e){G.combat.selectedEnemy=e.uid;render();sfx('click')}}
function targetEnemy(){const c=G.combat;if(!c)return null;let t=c.enemies.find(e=>e.uid===c.selectedEnemy&&e.hp>0);if(!t){t=c.enemies.find(e=>e.hp>0);if(t)c.selectedEnemy=t.uid}return t}
function attackDamage(base,e){let amount=Math.max(0,base+G.strength+(relicHas('blade')&&!G.combat.firstAttack?4:0));if(G.weak>0)amount=Math.floor(amount*.75);if(e.vuln>0)amount=Math.floor(amount*1.5);return amount}
function enemyHit(e,n,ignoreBlock=false){if(!e||e.hp<=0)return 0;let damage=Math.max(0,n);const blocked=ignoreBlock?0:Math.min(e.block,damage);e.block-=blocked;const actual=damage-blocked;e.hp=Math.max(0,e.hp-actual);if(actual>0)say(`${e.name} erleidet ${actual} Schaden.`);if(e.hp===0){G.kills++;say(`${e.name} wurde besiegt!`);if(relicHas('bloodstone'))heal(2)}return actual}
function strike(e,amount,ignoreBlock=false){if(!e||e.hp<=0)return;const dmg=attackDamage(amount,e);enemyHit(e,dmg,ignoreBlock);G.combat.firstAttack=true}
function addBlock(n){G.block+=n;sfx('block')}
function winIfDone(){const c=G.combat;if(!c||G.phase!=='combat')return false;if(c.enemies.some(e=>e.hp>0)){targetEnemy();return false}winCombat();return true}
function playCard(uid){if(G.phase!=='combat'||busy)return;const c=G.combat,i=c.hand.findIndex(x=>x.uid===Number(uid));if(i<0)return;const k=c.hand[i],d=CARDS[k.id];if(!d||d.type==='curse'||c.energy<d.cost)return;const e=targetEnemy(),u=k.up;if(!e&&['attack','skill'].includes(d.type))return;c.hand.splice(i,1);c.energy-=d.cost;G.played++;say(`${d.name}${u?'+':''} ausgespielt.`);if(d.type==='attack')sfx('hit');else sfx('card');switch(k.id){
case 'strike':strike(e,u?9:6);break;
case 'defend':addBlock(u?8:5);break;
case 'bash':strike(e,u?12:8);if(e.hp>0)e.vuln+=u?3:2;break;
case 'quick':strike(e,u?8:5);drawCards(1);break;
case 'twin':for(let j=0;j<2;j++)strike(e,u?6:4);break;
case 'cleave':for(const x of c.enemies)if(x.hp>0)strike(x,u?12:8);break;
case 'guard':addBlock(u?12:8);break;
case 'ward':addBlock(u?8:5);drawCards(1);break;
case 'poison':e.poison+=u?7:4;break;
case 'tactics':drawCards(u?3:2);break;
case 'flurry':for(let j=0;j<3;j++)strike(e,u?4:3);break;
case 'rally':addBlock(u?9:6);c.energy++;break;
case 'heavy':strike(e,u?21:15);break;
case 'pierce':strike(e,u?12:8,true);break;
case 'leech':strike(e,u?9:6);heal(u?5:3);break;
case 'execute':{let amount=(u?16:11)+(e.hp<=e.maxHp/2?(u?15:10):0);strike(e,amount);break}
case 'riposte':addBlock(u?9:6);G.thorns+=u?5:3;break;
case 'hex':e.weak+=u?3:2;e.vuln+=u?3:2;break;
case 'focus':c.energy+=u?3:2;break;
case 'blade':for(let j=0;j<(u?3:2);j++){if(c.hand.length<10)c.hand.push(card('shiv',G));else c.discard.push(card('shiv',G))}break;
case 'adrenaline':c.energy+=u?2:1;drawCards(u?3:2);break;
case 'shockwave':c.enemies.filter(x=>x.hp>0).forEach(x=>{x.weak+=u?3:2;x.vuln+=u?3:2});break;
case 'ritual':G.strength+=u?3:2;break;
case 'storm':for(const x of c.enemies)if(x.hp>0){strike(x,u?12:8);if(x.hp>0)x.poison+=2}break;
case 'ironwall':addBlock(u?24:17);break;
case 'siphon':strike(e,u?17:12);heal(u?7:5);break;
case 'shiv':strike(e,u?6:4);break;
}if(d.exhaust)c.exhaust.push(k);else c.discard.push(k);if(winIfDone())return;render()}
function enemyTick(e){if(e.hp<=0)return;if(e.poison>0){const n=e.poison;e.poison--;enemyHit(e,n,true);if(e.hp>0)say(`${e.name}: ${n} Giftschaden.`)}}
function enemyAction(e){if(e.hp<=0||G.phase!=='combat')return;const it=e.intent;if(!it)return;const ty=it.type;if(ty==='attack'||ty==='heavy'||ty==='multi'){for(let hit=0;hit<it.hits;hit++){if(G.phase!=='combat')break;const dmg=enemyAttackPower(e,it.value);damageHero(dmg,e.name);if(G.thorns>0&&G.phase==='combat')enemyHit(e,G.thorns,true);if(e.hp<=0)break}}else if(ty==='guard'){e.block+=it.value;say(`${e.name} erhält ${it.value} Block.`)}else if(ty==='buff'){e.strength+=it.value;say(`${e.name} erhält +${it.value} Stärke.`)}else if(ty==='hex'){G.weak+=it.value;say(`${e.name} fügt ${it.value} Schwach zu.`)}else if(ty==='poison'){G.poison+=it.value;say(`${e.name} fügt ${it.value} Gift zu.`)}else if(ty==='heal'){e.hp=Math.min(e.maxHp,e.hp+it.value)}e.weak=Math.max(0,e.weak-1);e.vuln=Math.max(0,e.vuln-1)}
function endTurn(){if(G.phase!=='combat'||busy)return;busy=true;const c=G.combat;c.discard.push(...c.hand);c.hand=[];G.weak=Math.max(0,G.weak-1);G.vuln=Math.max(0,G.vuln-1);say('Die Gegner sind am Zug.');for(const e of c.enemies)enemyTick(e);if(winIfDone()){busy=false;return}c.enemies.forEach(e=>{e.block=0});for(const e of c.enemies){if(G.phase!=='combat')break;enemyAction(e);if(winIfDone()){busy=false;return}}if(G.phase==='combat'){c.turn++;beginTurn(false)}busy=false;sfx('turn');render()}
function winCombat(){if(G.phase!=='combat')return;const kind=G.combat.kind;let base=kind==='boss'?130:kind==='elite'?75:18+G.act*8+R(0,15);let gold=Math.round(base*(relicHas('coin')?1.25:1));G.gold+=gold;if(relicHas('vial'))heal(4);if(relicHas('heart'))heal(10);let potion=null;if(G.potions.length<3&&Math.random()<(kind==='boss'?.95:.35)){potion=pick(Object.keys(POTIONS));G.potions.push(potion)}const rareBoost=kind!=='combat';G.reward={stage:'card',cards:rewardCards(3,rareBoost),relics:kind==='boss'?relicChoices(3,'boss'):kind==='elite'?relicChoices(3):[],gold,potion};G.phase='reward';say(`Sieg! ${gold} Gold erbeutet.`);sfx('win');render()}
function cardReward(id){if(G.phase!=='reward'||G.reward.stage!=='card'||!G.reward.cards.includes(id))return;addCard(id);say(`${CARDS[id].name} zum Deck hinzugefügt.`);nextReward()}
function nextReward(){if(G.reward.relics.length){G.reward.stage='relic';render()}else completeRoom()}
function skipReward(){if(G.phase==='reward'&&G.reward.stage==='card')nextReward()}
function chooseRelic(id,treasure=false){let r=G.reward;if(!r||!r.relics.includes(id))return;addRelic(id);if(treasure)completeRoom();else completeRoom()}
function openShop(){G.phase='shop';const cards=rewardCards(3);const relics=mix(availableRelics().filter(k=>RELICS[k].rarity!=='boss')).slice(0,2);let items=cards.map(id=>({kind:'card',id,price:CARDS[id].rarity==='rare'?105:CARDS[id].rarity==='uncommon'?76:49,sold:false}));for(const id of relics)items.push({kind:'relic',id,price:RELICS[id].rarity==='common'?130:170,sold:false});items.push({kind:'potion',id:pick(Object.keys(POTIONS)),price:35,sold:false});G.shop={items,removed:false,healed:false};render()}
function buyShop(i){const s=G.shop,it=s&&s.items[Number(i)];if(G.phase!=='shop'||!it||it.sold||G.gold<it.price)return;if(it.kind==='potion'&&G.potions.length>=3){notice('Maximal 3 Tränke möglich.');return}G.gold-=it.price;it.sold=true;if(it.kind==='card')addCard(it.id);if(it.kind==='relic')addRelic(it.id);if(it.kind==='potion')potionDrop(it.id);sfx('gold');render()}
function eventChoice(i){if(G.phase!=='event')return;const ev=EVENTS[G.event.idx],o=ev.opts[Number(i)];if(!o)return;switch(o.fx){case 'altar':loseHp(9);if(G.phase==='gameover')break;{let r=relicChoices(1)[0];if(r)addRelic(r);else G.gold+=50}break;case 'offering':if(G.gold<35)return;G.gold-=35;heal(24);break;case 'library':{let p=rewardCards(1,true)[0];if(p)addCard(p);addCard('curse');break}case 'study':overlay={kind:'upgrade',source:'event'};render();return;case 'spring':heal(20);break;case 'dive':loseHp(11);if(G.phase==='gameover')break;G.gold+=90;break;case 'alchemist':for(let j=0;j<2;j++)potionDrop(pick(Object.keys(POTIONS)));break;case 'rob':G.gold+=55;break;case 'mirror':G.maxHp+=6;loseHp(7);break;case 'shatter':addCard(pick(rewardCards(1)));G.gold+=30;break;case 'leave':break}if(G.phase==='gameover'){render();return}completeRoom()}
function usePotion(i){if(G.phase!=='combat'||busy)return;const index=Number(i),id=G.potions[index];if(!id)return;const target=targetEnemy();if(id==='heal'&&G.hp>=G.maxHp){notice('Du hast bereits volle Lebenspunkte.');return}G.potions.splice(index,1);switch(id){case 'heal':heal(22);sfx('heal');break;case 'fire':if(target)enemyHit(target,20,true);sfx('hit');break;case 'energy':G.combat.energy+=2;sfx('card');break;case 'venom':if(target)target.poison+=8;sfx('card');break;case 'guard':G.block+=18;sfx('block');break}say(`${POTIONS[id].name} benutzt.`);if(winIfDone())return;render()}
function upgradeCard(uid){if(!overlay||overlay.kind!=='upgrade')return;const c=G.deck.find(c=>c.uid===Number(uid));if(!c||c.up||c.id==='curse')return;c.up=true;const src=overlay.source;overlay=null;sfx('upgrade');if(src==='camp'||src==='event')completeRoom();else render()}
function removeCard(uid){if(!overlay||overlay.kind!=='remove'||G.deck.length<=1)return;const ix=G.deck.findIndex(c=>c.uid===Number(uid));if(ix<0)return;if(overlay.source==='shop'){if(G.gold<55||G.shop.removed)return;G.gold-=55;G.shop.removed=true}G.deck.splice(ix,1);overlay=null;sfx('card');render()}
function action(name,val){switch(name){case 'rules':overlay={kind:'rules'};renderModal();return;case 'deck':if(G&&G.deck){overlay={kind:'deck'};renderModal()}else notice('Beginne zuerst einen Durchlauf.');return;case 'close':overlay=null;renderModal();return;case 'mute':if(!G)G={phase:'menu',muted:false};G.muted=!G.muted;render();return;case 'menu':goMenu();return;case 'continue':{let s=load();if(s){G=s;overlay=null;busy=false;render()}return}case 'new':newGame();return;case 'room':enterRoom(val);return;case 'target':selectEnemy(val);return;case 'play':playCard(val);return;case 'endturn':endTurn();return;case 'pile':if(G.phase==='combat'){overlay={kind:'pile',pile:val};renderModal()}return;case 'potion':usePotion(val);return;case 'rewardCard':cardReward(val);return;case 'skipCard':skipReward();return;case 'chooseRelic':if(G.phase==='reward'&&G.reward.stage==='relic')chooseRelic(val);return;case 'skipRelic':if(G.phase==='reward'&&G.reward.stage==='relic')completeRoom();return;case 'campHeal':if(G.phase==='camp'){heal(Math.ceil(G.maxHp*.3));sfx('heal');completeRoom()}return;case 'campUpgrade':if(G.phase==='camp'){overlay={kind:'upgrade',source:'camp'};renderModal()}return;case 'campLeave':if(G.phase==='camp')completeRoom();return;case 'upgradeCard':upgradeCard(val);return;case 'removeCard':removeCard(val);return;case 'eventChoice':eventChoice(val);return;case 'buy':buyShop(val);return;case 'shopRemove':if(G.phase==='shop'&&!G.shop.removed&&G.gold>=55){overlay={kind:'remove',source:'shop'};renderModal()}return;case 'shopHeal':if(G.phase==='shop'&&!G.shop.healed&&G.gold>=35&&G.hp<G.maxHp){G.gold-=35;G.shop.healed=true;heal(24);sfx('heal');render()}return;case 'leaveRoom':if(G.phase==='shop'||G.phase==='treasure')completeRoom();return;case 'treasureRelic':if(G.phase==='treasure')chooseRelic(val,true);return}}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-action]');if(!t)return;const name=t.dataset.action;if(name==='closeOutside'){if(ev.target===t){overlay=null;renderModal()}return}if(overlay&&!['close','rules','upgradeCard','removeCard','deck'].includes(name))return;action(name,t.dataset.value)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(overlay){overlay=null;renderModal()}return}if(overlay||!G||G.phase!=='combat'||busy)return;if(ev.key===' '){ev.preventDefault();endTurn();return}if(/^[1-9]$/.test(ev.key)){const c=G.combat.hand[Number(ev.key)-1];if(c){ev.preventDefault();playCard(c.uid)}}});
window.addEventListener('error',e=>{console.error('CRYPT & CARDS',e.error)});
G={phase:'menu',muted:false};render();
})();
</script>
</body>
</html>
